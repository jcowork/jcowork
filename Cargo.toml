[workspace]
resolver = "2"
members = [
    "crates/jcowork-server",
    "crates/jcowork-gateway",
    "crates/jcowork-agent",
    "crates/jcowork-memory",
    "crates/jcowork-skills",
    "crates/jcowork-tools",
    "crates/jcowork-llm",
    "crates/jcowork-storage",
    "crates/jcowork-cron",
    "crates/jcowork-logs",
    "crates/jcowork-feishu",
    "crates/jcowork-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
jcowork-server = { path = "crates/jcowork-server" }
jcowork-gateway = { path = "crates/jcowork-gateway" }
jcowork-agent = { path = "crates/jcowork-agent" }
jcowork-memory = { path = "crates/jcowork-memory" }
jcowork-skills = { path = "crates/jcowork-skills" }
jcowork-tools = { path = "crates/jcowork-tools" }
jcowork-llm = { path = "crates/jcowork-llm" }
jcowork-storage = { path = "crates/jcowork-storage" }
jcowork-cron = { path = "crates/jcowork-cron" }
jcowork-feishu = { path = "crates/jcowork-feishu" }
jcowork-logs = { path = "crates/jcowork-logs" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = "0.5"

# Async HTTP client
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
reqwest-eventsource = "0.6"

# Futures
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "derive"] }

# Excel parsing
calamine = "0.36"

# Chinese segmentation
jieba-rs = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Concurrent collections
dashmap = "6"

# Scheduling
cron = "0.15"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Schema generation
schemars = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Errors
anyhow = "1"
thiserror = "2"

# Environment
dotenvy = "0.15"

# Async trait
async-trait = "0.1"

# Regex
regex = "1"

# Shell expansion
shellexpand = "3"

# Crypto / hashing
sha2 = "0.10"
hex = "0.4"

# Test utilities
tempfile = "3"

# Desktop app
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Open URLs/files in default browser
open = "5"

# Patch crates to fix MSVC build
[patch.crates-io]
numkong = { path = "patches/numkong" } # Fix: use /std:c11 + /utf-8 for MSVC
usearch = { path = "patches/usearch" } # Fix: add /utf-8 for MSVC
