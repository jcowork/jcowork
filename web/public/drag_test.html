<!DOCTYPE html>
<html>
<head>
<title>Drag Test</title>
<style>
body { background: #111; color: #eee; font-family: system-ui; padding: 20px; }
.test-area { display: flex; gap: 20px; margin: 20px 0; }
.box { width: 150px; height: 150px; border: 2px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.draggable { background: #1a3a5a; cursor: grab; }
.dropzone { background: #1a1a1a; }
.dropzone.over { background: #1a4a2a; border-color: #3fb950; }
#log { background: #000; color: #0f0; padding: 8px; font-family: monospace; font-size: 11px; max-height: 200px; overflow: auto; margin-top: 10px; border-radius: 4px; }
</style>
</head>
<body>
<h2>HTML5 Drag & Drop Test for Tauri WebView</h2>
<p>Drag the blue box onto the dark box. If it works, HTML5 DnD is enabled.</p>
<div class="test-area">
  <div id="drag" class="box draggable" draggable="true">Drag me</div>
  <div id="drop" class="box dropzone">Drop here</div>
</div>
<div id="status" style="font-size: 16px; margin: 10px 0;">Status: waiting...</div>
<div id="log"></div>

<script>
const drag = document.getElementById('drag');
const drop = document.getElementById('drop');
const status = document.getElementById('status');
const log = document.getElementById('log');

function addLog(msg) {
  const t = new Date().toLocaleTimeString();
  log.innerHTML += `[${t}] ${msg}\n`;
  log.scrollTop = log.scrollHeight;
  console.log(msg);
}

drag.addEventListener('dragstart', (e) => {
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'test-data');
  addLog('dragstart fired');
  status.textContent = 'Status: dragging...';
});

drag.addEventListener('dragend', () => {
  addLog('dragend fired');
});

drop.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  drop.classList.add('over');
  addLog('dragover fired - preventDefault called');
});

drop.addEventListener('dragenter', () => {
  addLog('dragenter fired');
});

drop.addEventListener('dragleave', () => {
  drop.classList.remove('over');
  addLog('dragleave fired');
});

drop.addEventListener('drop', (e) => {
  e.preventDefault();
  e.stopPropagation();
  drop.classList.remove('over');
  const data = e.dataTransfer.getData('text/plain');
  addLog(`drop fired! data="${data}"`);
  status.textContent = `Status: SUCCESS! Drop received data: "${data}"`;
  status.style.color = '#3fb950';
});

addLog('Page loaded, drag-drop listeners attached');
</script>
</body>
</html>
