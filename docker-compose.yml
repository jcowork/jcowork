version: "3.8"

services:
  jcowork:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - jcowork-data:/data
    environment:
      - JCWORK_HOST=0.0.0.0
      - JCWORK_PORT=3000
      - JCWORK_DATA_DIR=/data
      - JCWORK_JWT_SECRET=${JCWORK_JWT_SECRET:-change-me-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    restart: unless-stopped

volumes:
  jcowork-data:
