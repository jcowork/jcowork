name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # A transient failure on one platform (e.g. artifact-service 403) must not
      # cancel the other platform's build.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}

      # The artifact service occasionally returns a transient
      # "403 Forbidden / Failed to FinalizeArtifact" error. Retry the upload a
      # few times before giving up so a blip does not fail the whole release.
      - name: Upload bundle artifacts (retry on transient service errors)
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/upload-artifact@v4
          attempt_limit: 5
          attempt_delay: 15000
          with: |
            name: bundle-${{ matrix.target }}
            if-no-files-found: error
            path: |
              target/${{ matrix.target }}/release/bundle/dmg/*.dmg
              target/${{ matrix.target }}/release/bundle/msi/*.msi
              target/${{ matrix.target }}/release/bundle/nsis/*.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/**/*.dmg
            bundles/**/*.msi
            bundles/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
